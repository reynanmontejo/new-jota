# Initial HTTP site. Enable only after confirming DNS and the local app.
# Certbot adds HTTPS and the HTTP-to-HTTPS redirect during rollout.
server {
    listen 80;
    listen [::]:80;
    server_name jota.joynoadmin.tech;

    # The app enforces its own 100 MB file limit; allow multipart overhead.
    client_max_body_size 101m;

    location / {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # Preserve Next.js streaming and authenticated file responses.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
